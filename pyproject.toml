[project]
authors = [{name = "Bror Jönsson", email = "brorfred@gmail.com"}]
dependencies = []
description = "Spectrally resolved, depth-resolved ocean primary production model after Platt & Sathyendranath (PSM)"
name = "pp_models"
readme = "README.md"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
# The model is a set of flat top-level modules rather than a package.
only-include = [
    "absorption.py",
    "chlorophyll.py",
    "config.py",
    "daylight.py",
    "irradiance.py",
    "light_profile.py",
    "scatter.py",
    "size_fraction.py",
    "surface_light.py",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
pp_models = { path = ".", editable = true }

[tool.pixi.tasks]
notebook = "jupyter lab light_field.ipynb"

[tool.pixi.dependencies]
numpy = ">=2.1.2,<3"
scipy = ">=1.14.1,<2"
matplotlib = ">=3.9.2,<4"
ipython = ">=8.32.0,<9"
pandas = ">=2.2.3,<3"
xarray = ">=2024.10.0,<2025"
marimo = ">=0.9.33,<0.10"
pydap = ">=3.5.2,<4"
netcdf4 = ">=1.7.2,<2"
ruff = ">=0.8.2,<0.9"
jupyter = ">=1.1.1,<2"
notebook = ">=7.3.2,<8"
jupyterlab = ">=4.3.5,<5"

# Documentation tooling: `pixi run -e docs docs-serve` / `docs-build`
[tool.pixi.feature.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5,<10"
mkdocstrings = ">=0.26"
mkdocstrings-python = ">=1.11"

[tool.pixi.feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"

[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
